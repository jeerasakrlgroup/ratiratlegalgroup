# Daily check that the contact form still delivers mail: at 00:00 Thai time GitHub sends one test
# message through FormSubmit to the form owner only (Jeerasak, no _cc), as if from the live site.
# A failed run shows red under Actions and GitHub emails the account.
name: Contact form check
on:
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 00:00 Asia/Bangkok
  workflow_dispatch:        # "Run workflow" button for a manual test
jobs:
  send:
    runs-on: ubuntu-latest
    env:
      FORM_ID: 8b0e9951ce59a6d5a0e6763146968a4f
      SITE: https://www.ratiratlegalgroup.com
    steps:
      - name: Live site still uses this form
        run: curl -fsS "$SITE/main.js" | grep -q "$FORM_ID"
      - name: Send test message
        run: |
          now=$(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')
          res=$(curl -sS -X POST "https://formsubmit.co/ajax/$FORM_ID" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H "Origin: $SITE" -H "Referer: $SITE/" \
            -d "{\"_subject\":\"[ทดสอบอัตโนมัติ] ฟอร์มเว็บไซต์ $now\",\"_template\":\"table\",\"ผลการทดสอบ\":\"ฟอร์มติดต่อบนเว็บไซต์ยังส่งเมลได้ปกติ\",\"เวลา\":\"$now\"}")
          echo "$res"
          echo "$res" | grep -Eq '"success": ?"?true'
